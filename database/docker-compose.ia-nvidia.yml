# Asistente IA en tarjeta NVIDIA. Se suma al compose principal (prod o desarrollo):
#   tecnm ai install --gpu nvidia     (o --gpu auto: lo elige solo si nvidia-smi ve >= 4 GB)
#   desarrollo: docker compose -f docker-compose.yml -f docker-compose.ia-nvidia.yml --profile ia up -d ia
# Requiere: Windows con Docker Desktop (WSL2) o Linux con nvidia-container-toolkit.
services:
  ia:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11960
    environment:
      LLAMA_ARG_N_GPU_LAYERS: "99"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
