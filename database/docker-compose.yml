services:
  db:
    image: postgres:18-alpine
    container_name: tecnm_inventario_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tecnm_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?la variable POSTGRES_PASSWORD es obligatoria}
      POSTGRES_DB: ${POSTGRES_DB:-tecnm_inventario}
    ports:
      - "5433:5432"
    volumes:
      - tecnm_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # IA local para desarrollo (opcional): docker compose --profile ia up -d ia
  # Mismo modelo que producción (database/models/, lo baja `tecnm ia instalar`); solo en 127.0.0.1.
  ia:
    image: ghcr.io/ggml-org/llama.cpp:server-b11960
    profiles: [ia]
    container_name: tecnm_inventario_ia
    restart: unless-stopped
    command: >-
      -m /models/Qwen3.5-2B-Q4_K_M.gguf --mmproj /models/mmproj-F16.gguf --host 0.0.0.0 --port 8080
      --ctx-size 8192 --parallel 2 --threads 4 --jinja -ctk q8_0 -ctv q8_0 --image-max-tokens 512
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./models:/models:ro
    mem_limit: 3584m

volumes:
  tecnm_pgdata:
